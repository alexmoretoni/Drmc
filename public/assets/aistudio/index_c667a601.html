<style>

:root{--bg:#1f2329;--panel:#2a2f37;--panel2:#343a44;--line:#454d59;--ink:#eceef1;--mute:#aab2be;--accent:#c1b0f7;--ok:#6fd8b2;--bad:#ffa492;--s1:#8fb8ff;--s2:#f2b24b;--bandA:#3b4557;--bandB:#4a4238;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{min-height:100%;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:32px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;color:var(--accent)}
p{margin:0}
.mute{color:var(--mute)}.small{font-size:14px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1d1a2b;font-weight:600}
.btn.warn{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sess{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.st{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.st .id{font-family:var(--mono);font-size:14px;color:var(--mute)}
.st b{font-weight:600}.st.next .id{color:var(--accent);font-weight:700}
.tag{font-size:13px;color:var(--ok)}.tag.fl{color:var(--s2)}
details{border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute);min-width:0}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%}
/* tarefa */
.task{min-height:calc(100dvh - 48px);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,28px);max-width:760px;margin:0 auto;user-select:none;-webkit-user-select:none}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.exit{background:none;border:0;color:var(--mute);cursor:pointer;font-size:14px;padding:4px 0}
.cue{min-height:clamp(84px,14vh,116px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.word{font-size:clamp(22px,5vw,30px);font-weight:700;letter-spacing:.08em;min-height:1.4em}
.ic{width:clamp(56px,12vw,76px);height:clamp(56px,12vw,76px);fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.syms{display:flex;gap:18px}
.arr{display:flex;gap:6px}
.slot{width:clamp(38px,11vw,66px);height:clamp(38px,11vw,66px);display:flex;align-items:center;justify-content:center;background:var(--panel);border-radius:4px}
.slot .ic{width:78%;height:78%}
.slot .neu{width:18%;height:18%;border-radius:50%;background:var(--line)}

.fig{width:80%;height:80%;overflow:visible}
.arrow{color:var(--mute);font-size:20px}
.q{font-size:44px;color:var(--mute)}
.fix{font-size:40px;color:var(--mute);line-height:1}

.fb{min-height:36px;font-size:22px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.fb.ne{color:var(--mute);font-weight:400;font-size:16px}
.conf{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.scale{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.corsi{position:relative;width:min(100%,420px);aspect-ratio:1;background:var(--panel);border-radius:6px}
.csq{position:absolute;width:15%;height:15%;background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0;touch-action:manipulation}
.csq.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
.big{font-size:64px;font-family:var(--mono);min-height:1.3em;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:14px;z-index:9}
.ex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ex .box{width:68px;height:68px}
.ex .box.good{outline:2px solid var(--ok)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:12px var(--sans)}
.tip{position:fixed;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:13px;pointer-events:none;z-index:9;max-width:240px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;vertical-align:baseline;border-radius:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}

textarea{width:100%;height:120px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px var(--mono)}

function load(){if(POLAR){S=Object.assign(fresh(),POLAR.state);return}if(REMOTE){if(!INVITE)return;try{const x=JSON.parse(localStorage.getItem(KEY+':'+INVITE.i));if(x&&x.v===VERSION){S=x;return}}catch(e){}S=fresh();S.code=INVITE.i;S.form=INVITE.f==='B'?'B':'A';return}try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===VERSION)S=x}catch(e){}}
function save(){if(POLAR||(REMOTE&&!INVITE))return;try{localStorage.setItem(REMOTE?KEY+':'+INVITE.i:KEY,JSON.stringify(S))}catch(e){}}
let CUR=null, RUNNING=false, ABORT=false, escT=0, P=null, BLOCK=0, SUB='', CK=0;
class Abort extends Error{}
const chk=()=>{if(ABORT)throw new Abort()};
const rngFor=k=>RNG(hash('PA|'+S.form+'|'+k));
function log(o){S.rows.push(Object.assign({pid:S.code,forma:S.form,stage:CUR,fora_de_ordem:S.ooo[CUR]?1:0,bloco:BLOCK,t_ms:Math.round(performance.now()),t_wall:Math.round(performance.timeOrigin+performance.now())},o));if(LINKED&&CUR&&++CK>=10){CK=0;polarPartial('em_andamento')}}
const rowsOf=s=>S.rows.filter(r=>r.stage===s);

/* ---------- entrada ---------- */
function ask(o){return new Promise(res=>{const p={o,res,t:null};P=p;
 if(o.timeout)p.t=setTimeout(()=>fin(p,{v:null,ts:performance.now(),timeout:true}),o.timeout/SP);
 if(AUTO&&o.auto!==undefined)setTimeout(()=>{if(P===p)fin(p,{v:typeof o.auto==='function'?o.auto():o.auto,ts:performance.now()})},AUTO_MS);})}
function fin(p,r){clearTimeout(p.t);if(P===p)P=null;p.res(r)}
function toast(t){let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.append(e)}e.textContent=t;clearTimeout(e._t);e._t=setTimeout(()=>e.remove(),2200)}
function tryExit(){const n=Date.now();if(n-escT<2200){ABORT=true;if(P)fin(P,{v:null,ts:performance.now(),abort:true})}else{escT=n;toast('Repita para sair. Os dados desta fase serão descartados.')}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&RUNNING){tryExit();return}
 if(P&&!e.repeat&&P.o.keys&&e.key in P.o.keys){e.preventDefault();fin(P,{v:P.o.keys[e.key],ts:e.timeStamp})}});
document.addEventListener('pointerdown',e=>{const x=e.target.closest&&e.target.closest('.exit');if(x&&RUNNING){e.preventDefault();tryExit();return}
 const b=e.target.closest&&e.target.closest('[data-v]');if(b&&P){e.preventDefault();fin(P,{v:b.dataset.v,ts:e.timeStamp})}});

/* ---------- telas ---------- */
async function instr(title,html,btn='Continuar'){chk();window.scrollTo(0,0);
 app.innerHTML=`<div class="wrap"><div class="hud"><span>${esc(STAGE[CUR].t)}</span><button class="exit">Sair da fase</button></div><h2>${title}</h2><div class="stack">${html}</div><div class="row"><button class="btn pri" data-v="go">${btn}</button><span class="mute small">ou tecla Enter</span></div></div>`;
 const r=await ask({keys:{Enter:'go',' ':'go'},auto:'go'});if(r.abort)chk();chk()}
function shell(){window.scrollTo(0,0);app.innerHTML=`<div class="task"><div class="hud"><span id="hud"></span><button class="exit">Sair da fase</button></div><div class="cue" id="cue"></div><div class="seq" id="seq"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="conf" id="conf"></div></div>`}
const hud=t=>{const e=$('#hud');if(e)e.textContent=t};
function exRow(a,b,c,good){const f=[a,b];return`<div class="ex"><div class="box">${fig(f[0],COL[4])}</div><span class="arrow">→</span><div class="box">${fig(f[1],COL[1])}</div><span class="arrow">→</span><div class="box good">${fig(good===0?a:c,COL[3],.9)}</div></div>`}

/* ---------- geração de tentativas ---------- */
function balRules(n,rng){const base=[...Array(n)].map((_,i)=>i%2?'B':'A');let best=base,bs=1e9;
 for(let k=0;k<300;k++){const x=rng.shuffle(base);let run=1,mx=1;const tr={AA:0,AB:0,BA:0,BB:0};for(let i=1;i<n;i++){tr[x[i-1]+x[i]]++;run=x[i]===x[i-1]?run+1:1;mx=Math.max(mx,run)}if(mx>4)continue;const v=Object.values(tr),s=Math.max(...v)-Math.min(...v);if(s<bs){bs=s;best=x}}return best}
function trial(setN,rng,rule,prev,extra){const st=SET[setN];let f;let g=0;do{f=rng.shuffle(st).slice(0,3)}while(prev&&(f[0]===prev.f[0]||f[2]===prev.f[2])&&++g<40);
 const c0=rng.int(6);let c1=rng.int(5);if(c1>=c0)c1++;
 return Object.assign({setN,rule,f,col:[COL[c0],COL[c1],rng.pick(COL),rng.pick(COL),rng.pick(COL)],sc:[0,0,0,0,0].map(()=>rng.pick(SCL)),order:rng.shuffle([0,1,2]),fb:true,cue:null},extra||{})}
function series(setN,rng,rules,mk){let p=null;return rules.map((r,i)=>{const e=mk?mk(r,i):{};p=trial(setN,rng,r,p,e);return p})}

/* ---------- uma tentativa ---------- */
function paintCue(c){const e=$('#cue');if(!c){e.innerHTML='';return}
 if(c.kind==='word')e.innerHTML=`<div class="word">${WORD[c.rule]}</div>`;
 else if(c.kind==='sym')e.innerHTML=`<div class="syms">${c.syms.map(ic).join('')}</div>`;
 else if(c.kind==='arr')e.innerHTML=`<div class="arr">${c.slots.map(s=>`<div class="slot">${s?ic(s):'<div class="neu"></div>'}</div>`).join('')}</div><div class="word">${c.word?WORD[c.word]:''}</div>`;
 else if(c.kind==='mask')e.innerHTML=`<div class="arr">${[...Array(7)].map(()=>'<div class="slot mask"></div>').join('')}</div><div class="word"></div>`}
function paintSeq(t){$('#seq').innerHTML=`<div class="box">${fig(t.f[0],t.col[0],t.sc[0])}</div><span class="arrow">→</span><div class="box">${fig(t.f[1],t.col[1],t.sc[1])}</div><span class="arrow">→</span><div class="box"><span class="q">?</span></div>`;
 $('#opts').innerHTML=t.order.map((role,p)=>`<button class="opt" data-v="${p}" aria-label="Opção ${p+1}"><div class="box">${fig(t.f[role],t.col[2+p],t.sc[2+p])}</div><kbd>${p+1}</kbd></button>`).join('')}
async function runTrial(t){chk();$('#cue').innerHTML='';$('#opts').innerHTML='';$('#fb').textContent='';$('#fb').className='fb';$('#conf').innerHTML='';
 $('#seq').innerHTML='<div class="fix">+</div>';await wait(400);chk();$('#seq').innerHTML='';
 if(t.cue&&t.cue.kind==='arr'&&t.cueMs){paintCue(t.cue);await wait(t.cueMs);chk();paintCue({kind:'mask'});await wait(100);$('#cue').innerHTML='';await wait(150);chk()}else paintCue(t.cue);
 paintSeq(t);const t0=await frame();
 const r=await ask({keys:{1:'0',2:'1',3:'2'},timeout:6000,auto:()=>AUTO(t)});if(r.abort)chk();
 const pos=r.timeout?null:+r.v;let rt=r.timeout?null:Math.round(Math.max(r.ts,t0)-t0);if(rt!==null&&rt<=0)rt=Math.round(performance.now()-t0);
 const role=pos===null?null:t.order[pos],corr=role===(t.rule==='A'?0:2);
 if(pos!==null){const el=document.querySelectorAll('.opt')[pos];if(el)el.classList.add('sel')}
 let conf=null;
 if(t.conf&&pos!==null){$('#conf').innerHTML=`<span class="mute small">Confiança nesta resposta</span><div class="scale">${[1,2,3,4].map(v=>`<button class="btn" data-v="${v}">${v}</button>`).join('')}</div><span class="mute small">1 = chute, 4 = certeza</span>`;
  const c=await ask({keys:{1:'1',2:'2',3:'3',4:'4'},auto:'3'});if(c.abort)chk();conf=+c.v;$('#conf').innerHTML=''}
 let shown='none';const fb=$('#fb');
 if(pos===null){fb.textContent='Muito lento';fb.className='fb ne';await wait(900)}
 else if(t.fb){const val=t.fb==='q'&&t.flip?!corr:corr;shown=val?'+':'-';fb.textContent=val?'Correto':'Incorreto';fb.className='fb '+(val?'ok':'no');await wait(750)}
 else{fb.textContent='';await wait(350)}
 log({n:t.n,regra:t.rule,cond:t.cond||'',instr:t.instr||'',pista:t.cueName||'',validade_q:t.fb==='q'?(t.flip?0:1):'',f1:t.f[0],f2:t.f[1],nova:t.f[2],pos,papel:role===null?'':['F1','F2','nova'][role],tr:rt,omissao:pos===null?1:0,acerto:corr?1:0,fb:shown,conf:conf===null?'':conf,cue_ms:t.cueMs||'',segmento:t.seg||'',sonda:t.probe?1:0,excecao:t.exc===undefined?'':(t.exc?1:0),lag:t.lag===undefined?'':t.lag,tipo:t.tipo||'',reversao:t.rev||''});
 $('#seq').innerHTML='';$('#opts').innerHTML='';$('#cue').innerHTML='';fb.textContent='';await wait(250);chk();
 return{corr,rule:t.rule,role,rt,shown}}
async function runList(list,label){let c=0;const by={A:[0,0],B:[0,0]};shell();
 for(let i=0;i<list.length;i++){list[i].n=list[i].n||i+1;hud(`${label} · ${i+1}/${list.length}`);const r=await runTrial(list[i]);if(r.corr)c++;by[r.rule][0]+=r.corr?1:0;by[r.rule][1]++}return{c,n:list.length,by}}

/* ---------- fases ---------- */
async function st1A(){await instr('Fase 1A: as duas regras',`<p>Você verá duas figuras em sequência e escolherá a terceira entre três opções: a primeira figura, a segunda figura e uma figura nova.</p>
 <h3>Repetição</h3><p>A terceira figura é igual à primeira.</p>${exRow('barra','halter','gancho',0)}
 <h3>Exclusão</h3><p>A terceira figura é diferente das duas primeiras.</p>${exRow('barra','halter','gancho',2)}
 <p>Igual significa ter a mesma forma. Cor e tamanho variam e não contam.</p><p>Nesta fase o nome da regra aparece na tela. Responda com as teclas <b>1, 2, 3</b> ou tocando na opção. Você tem até 6 segundos e recebe feedback a cada resposta.</p>`,'Começar');
 let b=0,ok=false;while(b<6&&!ok){b++;BLOCK=b;const rng=rngFor('1A-'+b);const list=series('O',rng,balRules(20,rng),r=>({cue:{kind:'word',rule:r}}));
  const s=await runList(list,`Fase 1A · bloco ${b}`);ok=s.c>=18&&s.by.A[0]>=9&&s.by.B[0]>=9;
  await instr(`Bloco ${b}: ${s.c} de 20`,`<p class="mute">Repetição ${s.by.A[0]}/10 · Exclusão ${s.by.B[0]}/10. Critério: 18 de 20, com pelo menos 9 em cada regra.</p>`,ok||b>=6?'Concluir':'Próximo bloco')}
 S.res['1A']={blocks:b,passed:ok}}
const symLeg=(a,b)=>`<div class="row" style="gap:28px">${[a,b].map(s=>`<div class="stack" style="align-items:center;gap:2px">${ic(s)}<span class="mute small">${NOME[s]}</span></div>`).join('')}</div>`;
async function st1B(){await instr('Fase 1B: símbolos no lugar das palavras',`${symLeg('lua','sol')}<p>Agora o nome da regra sai. Cada símbolo indica uma das duas regras, sempre a mesma. Descubra qual pelo feedback.</p>`,'Começar');
 let b=0,streak=0;while(b<6&&streak<2){b++;BLOCK=b;const rng=rngFor('1B-'+b);const rules=balRules(20,rng);const list=series('O',rng,rules,r=>{const cueName=r==='A'?'lua':'sol';return{cue:{kind:'sym',syms:[cueName]},cueName}});
  const s=await runList(list,`Fase 1B · bloco ${b}`);const good=s.c>=18&&s.by.A[0]>=8&&s.by.B[0]>=8;streak=good?streak+1:0;
  await instr(`Bloco ${b}: ${s.c} de 20`,`<p class="mute">Critério: pelo menos 18 de 20, com ao menos 8 em cada regra, em dois blocos seguidos.</p>`,streak>=2||b>=6?'Concluir':'Próximo bloco')}
 await symbolCheck();S.res['1B']={blocks:b,passed:streak>=2}}
async function symbolCheck(){for(const s of['lua','sol']){BLOCK=0;chk();app.innerHTML=`<div class="wrap"><h2>Qual regra este símbolo indica?</h2><div>${ic(s)}</div><div class="row"><button class="btn" data-v="A">1 · Repetição</button><button class="btn" data-v="B">2 · Exclusão</button></div></div>`;
  const r=await ask({keys:{1:'A',2:'B'},auto:MAP[s]});if(r.abort)chk();log({n:0,tipo:'checagem',pista:s,regra:MAP[s],resposta:r.v,acerto:r.v===MAP[s]?1:0})}}
function slots7(rng,arr){const pos=rng.shuffle([0,1,2,3,4,5,6]),s=Array(7).fill(null);arr.forEach((a,i)=>s[pos[i]]=a);return s}
async function st2T(){await instr('Fase 2A, treino: novos símbolos',`<p>Vários símbolos aparecem agora em uma fileira de sete lugares. Alguns indicam a regra e outros não indicam nada. Descubra quais pelo feedback.</p><p>Lua e Sol continuam indicando o mesmo de antes.</p>`,'Começar');
 let b=0,ok=false;while(b<4&&!ok){b++;BLOCK=b;const rng=rngFor('2T-'+b);const inf=[...CUES.A,...CUES.B].flatMap(x=>[x,x,x,x]);const irrA=rng.shuffle(IRR.flatMap(x=>[x,x])),irrB=rng.shuffle(IRR.flatMap(x=>[x,x]));
  let tr=rng.shuffle(inf).map(c=>({c,r:MAP[c]}));let ia=0,ib=0;const noIrr=new Set(rng.shuffle([...Array(24).keys()]).slice(0,8));
  let p=null;const list=tr.map((x,i)=>{let ir=null;if(!noIrr.has(i)){if(x.r==='A'&&ia<irrA.length)ir=irrA[ia++];else if(x.r==='B'&&ib<irrB.length)ir=irrB[ib++]}
   const sl=slots7(rng,ir?[x.c,ir]:[x.c]);p=trial('O',rng,x.r,p,{cue:{kind:'arr',slots:sl},cueName:x.c+(ir?'+'+ir:'')});return p});
  const s=await runList(list,`Treino de símbolos · bloco ${b}`);ok=s.c>=21;
  await instr(`Bloco ${b}: ${s.c} de 24`,`<p class="mute">Critério: pelo menos 21 de 24.</p>`,ok||b>=4?'Concluir':'Próximo bloco')}
 S.res['2T']={blocks:b,passed:ok}}
function arrCue(rng,rule,nInf,nIrr,explicit){const inf=nInf===1?[rng.pick(CUES[rule])]:CUES[rule].slice(),irr=rng.shuffle(IRR).slice(0,nIrr);
 return{slots:slots7(rng,explicit?irr:[...inf,...irr]),inf}}
async function st2C(){await instr('Fase 2A, ajuste de velocidade',`<p>Agora os símbolos aparecem por um instante e somem antes das figuras. O tempo de exibição se ajusta ao seu desempenho, então a tarefa fica difícil de propósito.</p><p>Não há feedback nesta parte. Responda como conseguir.</p>`,'Começar');
 BLOCK=1;const rng=rngFor('2CAL');const rules=balRules(40,rng);let D=800,st=0,dir=0;const rev=[];shell();let prev=null;
 for(let i=0;i<40;i++){hud(`Ajuste · ${i+1}/40`);const a=arrCue(rng,rules[i],1,4,false);prev=trial('T',rng,rules[i],prev,{n:i+1,cue:{kind:'arr',slots:a.slots},cueMs:Math.round(D),fb:false,cueName:a.inf.join('+'),cond:'C3',instr:'inferida'});
  const r=await runTrial(prev);if(r.corr){st++;if(st===2){st=0;if(dir===1)rev.push(D);dir=-1;D=Math.max(50,D/1.22)}}else{st=0;if(dir===-1)rev.push(D);dir=1;D=Math.min(2000,D*1.22)}}
 const last=rev.slice(-6),thr=last.length>=2?Math.exp(mean(last.map(Math.log))):D;S.res['2CAL']={thr:Math.round(thr),cueMs:Math.round(Math.min(1500,Math.max(100,thr))),reversoes:rev.length}}
async function st2A(){const cueMs=(S.res['2CAL']||{}).cueMs||500;await instr('Fase 2A: teste com figuras inéditas',`<p>As figuras agora são novas. As regras e os símbolos são os mesmos, e não há feedback.</p><p>Em metade das tentativas a palavra da regra aparece no lugar dos símbolos que a indicam. Na outra metade, use os símbolos.</p><p class="mute small">Tempo de exibição calibrado: ${cueMs} ms.</p>`,'Começar');
 const rng=rngFor('2A');const C={C1:[1,0],C2:[3,0],C3:[1,4],C4:[3,4]};let cells=[];for(const c in C)for(const ins of['explicita','inferida'])for(const r of['A','B'])for(let k=0;k<5;k++)cells.push({c,ins,r});
 cells=rng.shuffle(cells);let prev=null;const list=cells.map(x=>{const[nI,nR]=C[x.c];const exp=x.ins==='explicita';const a=arrCue(rng,x.r,nI,nR,exp);prev=trial('T',rng,x.r,prev,{cue:{kind:'arr',slots:a.slots,word:exp?x.r:null},cueMs,fb:false,cond:x.c,instr:x.ins,cueName:exp?'':a.inf.join('+')});return prev});
 BLOCK=1;await runList(list.slice(0,40),'Fase 2A · bloco 1');await instr('Pausa','<p class="mute">Descanse o quanto quiser.</p>','Continuar');BLOCK=2;const l2=list.slice(40);l2.forEach((t,i)=>t.n=41+i);await runList(l2,'Fase 2A · bloco 2');S.res['2A']={cueMs}}
async function st2B(){await instr('Fase 2B: dois símbolos novos',`${symLeg('losango','estrela')}<p>Cada um destes símbolos indica uma das duas regras. Descubra qual pelo feedback.</p>`,'Começar');
 const cueT=(c)=>({cue:{kind:'sym',syms:[c]},cueName:c});const pick=r=>r==='A'?'losango':'estrela';
 BLOCK=1;let rng=rngFor('2B-L');let list=series('B1',rng,balRules(40,rng),r=>cueT(pick(r)));let s=await runList(list,'Fase 2B · aprendizagem');
 let ext=0,lastOk=rowsOf('2B').slice(-20).reduce((a,r)=>a+r.acerto,0)>=18;
 while(!lastOk&&ext<3){ext++;BLOCK=1+ext;rng=rngFor('2B-X'+ext);list=series('B1',rng,balRules(20,rng),r=>cueT(pick(r)));s=await runList(list,`Fase 2B · extensão ${ext}`);lastOk=s.c>=18}
 await instr('Agora sem feedback','<p>Mesmos símbolos, figuras novas. Você não saberá se acertou.</p>','Continuar');
 BLOCK=10;rng=rngFor('2B-T');list=series('B2',rng,balRules(20,rng),r=>Object.assign(cueT(pick(r)),{fb:false,tipo:'teste_novas'}));await runList(list,'Fase 2B · teste');
 await instr('Símbolos anteriores','<p>Lua e Sol voltam, também sem feedback.</p>','Continuar');
 BLOCK=11;rng=rngFor('2B-O');list=series('B2',rng,balRules(20,rng),r=>Object.assign(cueT(r==='A'?'lua':'sol'),{fb:false,tipo:'teste_antigas'}));await runList(list,'Fase 2B · teste');S.res['2B']={ext,passed:lastOk}}
async function st2R(){await instr('Fase 2C: Lua e Sol com feedback',`${symLeg('lua','sol')}<p>Você volta a receber feedback nas tentativas com Lua e Sol. Em algumas tentativas aparece outro símbolo já visto, e nelas não há feedback.</p>`,'Começar');
 BLOCK=1;const rng=rngFor('2R');const r1=17+rng.int(9),r2=39+rng.int(9);
 const cues=(()=>{for(;;){const x=rng.shuffle([...Array(60)].map((_,i)=>i%2?'sol':'lua'));let ok=true;for(let i=3;i<60;i++)if(x[i]===x[i-1]&&x[i]===x[i-2]&&x[i]===x[i-3]){ok=false;break}if(ok)return x}})();
 const slotsP=rng.shuffle([...Array(r2-1-(r1+8)+1)].map((_,i)=>r1+8+i)).slice(0,6);const probes=rng.shuffle(['losango','losango','losango','estrela','estrela','estrela']);
 let prev=null;const list=[];cues.forEach((c,i)=>{const n=i+1,inv=(n>=r1&&n<r2);const rule=inv?(MAP[c]==='A'?'B':'A'):MAP[c];prev=trial('C',rng,rule,prev,{n,cue:{kind:'sym',syms:[c]},cueName:c,seg:n<r1?1:n<r2?2:3,rev:n===r1?1:n===r2?2:''});list.push(prev);
  const k=slotsP.indexOf(n);if(k>=0){const pc=probes[k];prev=trial('C',rng,MAP[pc],prev,{n:n+.5,cue:{kind:'sym',syms:[pc]},cueName:pc,fb:false,probe:true,seg:2});list.push(prev)}});
 await runList(list,'Fase 2C');S.res['2C']={r1,r2}}
/* 2P: Lua e Sol valem em 80% das tentativas; o feedback é sempre verdadeiro.
   Exceções: 20% por pista em cada segmento, nunca nas 2 primeiras do segmento,
   nunca duas seguidas da mesma pista. Duas reversões em posições fixas por forma. */
async function st2P(){await instr('Fase 2P: Lua e Sol menos confiáveis',`${symLeg('lua','sol')}<p>Lua e Sol continuam indicando as regras, mas agora <b>nem sempre acertam</b>: na maior parte das tentativas vale a regra do símbolo; em algumas, vale a outra.</p><p>O feedback está sempre certo. Use-o para decidir o que fazer nas próximas vezes.</p>`,'Começar');
 BLOCK=1;const rng=rngFor('2P');const N=100,r1=34+rng.int(5),r2=67+rng.int(5);const seg=n=>n<r1?1:n<r2?2:3;const flip=r=>r==='A'?'B':'A';
 const cues=(()=>{for(;;){const x=rng.shuffle([...Array(N)].map((_,i)=>i%2?'sol':'lua'));let ok=true;for(let i=3;i<N;i++)if(x[i]===x[i-1]&&x[i]===x[i-2]&&x[i]===x[i-3]){ok=false;break}if(ok)return x}})();
 const exc=new Set();
